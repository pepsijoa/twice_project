<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>재고 관리 - IoT 로봇 시스템</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="stylesheet" href="/static/css/inventory.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📦 재고 관리</h1>
            <a href="/" class="home-button">🏠 홈으로</a>
        </div>

        <div class="controls">
            <div class="search-bar">
                <input type="text" class="search-input" id="searchInput" placeholder="🔍 재고 검색...">
                <button class="add-button" id="addItemBtn">➕ 재고 추가</button>
            </div>
        </div>

        <div id="inventoryGrid" class="inventory-grid">
            <div style="text-align: center; padding: 40px; color: white;">
                <h3>⏳ 재고 데이터를 불러오는 중...</h3>
            </div>
        </div>

        <div class="empty-state" style="display: none;" id="emptyState">
            <h2>재고가 없습니다</h2>
            <p>➕ 재고 추가 버튼을 눌러 새로운 재고를 추가하세요.</p>
        </div>
    </div>

    <div id="mapModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeMapModal()">&times;</span>
            <h2 id="modalTitle">재고 위치 정보</h2>
            <div class="map-container">
                <div id="mapDisplay" class="map-placeholder">
                    맵을 불러오는 중...
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/inventory.js"></script>
    <script src="/static/js/map-display.js"></script>
</body>
</html>
