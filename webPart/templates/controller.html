<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="방향 컨트롤러">
    <title>방향 제어 컨트롤러</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    
    <!-- 아이콘 설정 -->
    <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='images/icon-192.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/icon-192.png') }}">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>방향 컨트롤러</h1>
        
        <!-- 맵 표시 영역 -->
        <div class="map-container">
            <h2>🗺️ 실시간 맵</h2>
            <div id="map-info" class="map-status">맵 로딩 중...</div>
            <div class="map-grid" id="map-grid">
                <!-- 맵 셀들이 동적으로 생성됩니다 -->
            </div>
            <div class="map-legend">
                <div class="legend-item">
                    <div class="legend-color empty"></div>
                    <span>⬜ 미지 영역 (0)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color path"></div>
                    <span>🟢 이동 가능 (1)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color blocked"></div>
                    <span>⬛ 갈 수 없는 곳 (-1)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color feature"></div>
                    <span>🔶 재고 위치 (2)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color current"></div>
                    <span>🤖 현재 위치 (3)</span>
                </div>
            </div>
        </div>
        
        <div class="controller">
            <!-- 위쪽 버튼 -->
            <div class="button-row">
                <button class="direction-btn" data-direction="up" id="btn-up">
                    <span class="arrow">⬆️</span>
                    <span class="text">위</span>
                </button>
            </div>
            
            <!-- 중간 줄: 왼쪽, 가운데, 오른쪽 -->
            <div class="button-row">
                <button class="direction-btn" data-direction="left" id="btn-left">
                    <span class="arrow">⬅️</span>
                    <span class="text">왼쪽</span>
                </button>
                
                <!-- 카메라 버튼 (중앙) -->
                <button class="camera-btn center-camera" id="camera-btn">
                    <span class="camera-icon">📸</span>
                </button>
                
                <button class="direction-btn" data-direction="right" id="btn-right">
                    <span class="arrow">➡️</span>
                    <span class="text">오른쪽</span>
                </button>
            </div>
            
            <!-- 아래쪽 버튼 -->
            <div class="button-row">
                <button class="direction-btn" data-direction="down" id="btn-down">
                    <span class="arrow">⬇️</span>
                    <span class="text">아래</span>
                </button>
            </div>
        </div>
        
        <!-- 매핑 버튼 -->
        <div class="mapping-button-container">
            <button class="mapping-btn" id="mapping-btn" data-state="ready">
                <span class="mapping-icon">🗺️</span>
                <span class="mapping-text">매핑</span>
            </button>
        </div>
        
        <!-- 리매핑 버튼 -->
        <div class="remapping-button-container">
            <button class="remapping-btn" id="remapping-btn">
                <span class="remapping-icon">🔄</span>
                <span class="remapping-text">새로 매핑</span>
            </button>
        </div>
        
        <!-- 홈 버튼 -->
        <div class="home-button-container">
            <a href="/" class="home-button">
                <span class="home-icon">🏠</span>
                <span class="home-text">홈으로</span>
            </a>
        </div>
    </div>
    
    <!-- 매핑 완료 팝업 -->
    <div id="mapping-done-popup" class="popup-overlay" style="display: none;">
        <div class="popup-container">
            <div class="popup-header">
                <h3>🗺️ 매핑 완료</h3>
            </div>
            <div class="popup-content">
                <p>현재 매핑은 모두 완료되었습니다.</p>
                <p>더 이상 이동할 수 없습니다.</p>
            </div>
            <div class="popup-footer">
                <button id="close-mapping-popup" class="popup-close-btn">
                    <span class="close-icon">✓</span>
                    <span class="close-text">확인</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 특징점 이름 입력 팝업 -->
    <div id="feature-name-popup" class="popup-overlay" style="display: none;">
        <div class="popup-container">
            <div class="popup-header">
                <h3>📸 특징점 이름 입력</h3>
            </div>
            <div class="popup-content">
                <p>저장할 위치의 이름을 입력하세요:</p>
                <input type="text" id="feature-name-input" class="popup-input" placeholder="예: 거실, 부엌, 충전소" autocomplete="off">
            </div>
            <div class="popup-footer">
                <button id="cancel-feature-btn" class="popup-btn cancel">취소</button>
                <button id="confirm-feature-btn" class="popup-btn confirm">확인</button>
            </div>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    
    <!-- Service Worker 등록 -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register("{{ url_for('static', filename='sw.js') }}")
                .then(registration => console.log('✅ Service Worker 등록 성공:', registration))
                .catch(error => console.log('❌ Service Worker 등록 실패:', error));
        }
    </script>
</body>
</html>
